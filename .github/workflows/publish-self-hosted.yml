name: Publish package (self-hosted fallback)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed tag matching package.json
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  npm:
    runs-on: [self-hosted, macOS, ARM64, velaros-package-publish]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@velaros-ai'
      - name: Verify immutable release source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$SOURCE_SHA"
      - run: npm ci
      - run: npm run check
      - id: release
        name: Build the immutable release bundle
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node scripts/prepare-release.mjs \
            --tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA" \
            --out-dir release \
            --require-tag
          echo "tarball=$(node -p 'require("./release/release-manifest.json").tarball.fileName')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: html-artifacts-${{ inputs.release_tag }}-${{ inputs.source_sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90
      - run: npm publish "./release/${{ steps.release.outputs.tarball }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
